components:
  schemas:
    AcademicSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: e.g., 2026-27
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        institution:
          type: string
          format: uuid
      required:
      - created_at
      - end_date
      - id
      - institution
      - name
      - start_date
      - updated_at
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 255
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
        short_code:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - credit
      - id
      - name
      - short_code
      - updated_at
    CourseOffering:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course_name:
          type: string
          readOnly: true
        course_code:
          type: string
          readOnly: true
        section_name:
          type: string
          readOnly: true
        weekly_periods:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        default_class_type:
          $ref: '#/components/schemas/DefaultClassTypeEnum'
        required_block_size:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        room_type_requirement:
          type: string
          maxLength: 50
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        semester:
          type: string
          format: uuid
        section:
          type: string
          format: uuid
        course:
          type: string
          format: uuid
        preferred_room:
          type: string
          format: uuid
          nullable: true
      required:
      - course
      - course_code
      - course_name
      - created_at
      - id
      - section
      - section_name
      - semester
      - updated_at
      - weekly_periods
    DefaultClassTypeEnum:
      enum:
      - LECTURE
      - TUTORIAL
      - PRACTICAL
      - COMMON
      - LIBRARY
      - OTHER
      type: string
      description: |-
        * `LECTURE` - Lecture
        * `TUTORIAL` - Tutorial
        * `PRACTICAL` - Practical
        * `COMMON` - Common
        * `LIBRARY` - Library
        * `OTHER` - Other
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        institution_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        institution:
          type: string
          format: uuid
      required:
      - code
      - created_at
      - id
      - institution
      - institution_name
      - name
      - updated_at
    Faculty:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        employee_code:
          type: string
          maxLength: 50
        initials:
          type: string
          maxLength: 10
        max_daily_periods:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        max_weekly_periods:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: string
          format: uuid
        department:
          type: string
          format: uuid
      required:
      - created_at
      - department
      - email
      - employee_code
      - id
      - initials
      - name
      - updated_at
      - user
    FacultyAvailability:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          minimum: 0
          maximum: 9223372036854775807
        is_available:
          type: boolean
        preference_weight:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        faculty:
          type: string
          format: uuid
        time_slot:
          type: string
          format: uuid
      required:
      - created_at
      - faculty
      - id
      - time_slot
      - updated_at
      - weekday
    GenerationConfig:
      type: object
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: FILL_GAPS
        section_ids:
          type: array
          items:
            type: string
            format: uuid
        offering_rules:
          type: array
          items: {}
        max_solve_seconds:
          type: integer
          maximum: 60
          minimum: 1
        random_seed:
          type: integer
        soft_constraints: {}
    GenerationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        mode:
          type: string
          maxLength: 40
        status:
          allOf:
          - $ref: '#/components/schemas/GenerationRunStatusEnum'
          readOnly: true
        solver_status:
          allOf:
          - $ref: '#/components/schemas/SolverStatusEnum'
          readOnly: true
        input_config: {}
        input_snapshot: {}
        result:
          readOnly: true
        diagnostics:
          readOnly: true
        statistics:
          readOnly: true
        objective_score:
          type: number
          format: double
          readOnly: true
          nullable: true
        source_fingerprint:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        error_message:
          type: string
        timetable:
          type: string
          format: uuid
        source_version:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
          readOnly: true
        applied_version:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - applied_at
      - applied_version
      - completed_at
      - created_at
      - created_by
      - diagnostics
      - id
      - objective_score
      - result
      - solver_status
      - source_fingerprint
      - source_version
      - started_at
      - statistics
      - status
      - timetable
    GenerationRunStatusEnum:
      enum:
      - PENDING
      - RUNNING
      - SUCCEEDED
      - INFEASIBLE
      - FAILED
      - APPLIED
      type: string
      description: |-
        * `PENDING` - Pending
        * `RUNNING` - Running
        * `SUCCEEDED` - Succeeded
        * `INFEASIBLE` - Infeasible
        * `FAILED` - Failed
        * `APPLIED` - Applied
    Institution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
